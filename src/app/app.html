<header class="app-toolbar card">
  <div class="toolbar-copy">
    <p class="eyebrow">A Standalone Ghostfolio tool</p>
    <strong>Ghostfolio Rebalancer</strong>
  </div>

  <div class="toolbar-actions">
    @if (showGhostfolioButton()) {
      <button
        class="ghostfolio-link-button"
        type="button"
        [disabled]="!canOpenGhostfolio()"
        (click)="openGhostfolio()"
      >
        {{ isGhostfolioLoading() ? 'Opening Ghostfolio...' : 'Ghostfolio' }}
      </button>
    }

    <label class="theme-picker">
      <span>Theme</span>
      <select [value]="themeMode()" (change)="updateThemeMode($event)">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </div>
</header>

@if (ghostfolioErrorMessage()) {
  <p class="app-toolbar-message">{{ ghostfolioErrorMessage() }}</p>
}

<router-outlet></router-outlet>
