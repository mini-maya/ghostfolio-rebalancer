<header class="app-toolbar card">
  <div class="toolbar-copy">
    <p class="eyebrow">A Standalone Ghostfolio tool</p>
    <strong>Ghostfolio Rebalancer</strong>
  </div>

  <div class="toolbar-actions">
    @if (showGhostfolioButton()) {
      <button
        class="ghostfolio-link-button"
        type="button"
        [disabled]="!canOpenGhostfolio()"
        (click)="openGhostfolio()"
      >
        {{ isGhostfolioLoading() ? 'Opening Ghostfolio...' : 'Ghostfolio' }}
      </button>
    }

    @if (showLogoutButton()) {
      <button
        class="logout-button"
        type="button"
        [disabled]="isLoggingOut()"
        (click)="logout()"
      >
        <svg
          aria-hidden="true"
          class="button-icon"
          viewBox="0 0 24 24"
        >
          <path
            d="M10 17l1.41-1.41L8.83 13H20v-2H8.83l2.58-2.59L10 7l-5 5zm-6 4h9v-2H4V5h9V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2z"
            fill="currentColor"
          />
        </svg>
        <span>{{ isLoggingOut() ? 'Logging out...' : 'Logout' }}</span>
      </button>
    }

    <label class="theme-picker">
      <span>Theme</span>
      <select [value]="themeMode()" (change)="updateThemeMode($event)">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </div>
</header>

@if (ghostfolioErrorMessage()) {
  <p class="app-toolbar-message">{{ ghostfolioErrorMessage() }}</p>
}

<router-outlet></router-outlet>
